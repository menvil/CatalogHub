# Cubic.dev reviews feature/* PRs targeting develop as well as release/* and
# hotfix/* PRs. Ignore secondary target branches and non-review source branches.
version: 1

reviews:
  ignore:
    base_branches:
      - "feature/*"
      - "bugfix/*"
      - "chore/*"
      - "docs/*"
      - "fix/*"
      - "refactor/*"
      - "spike/*"
      - "test/*"
      - "experiment/*"
      - "wip/*"
      - "tmp/*"
      - "draft/*"
    head_branches:
      - "bugfix/*"
      - "chore/*"
      - "docs/*"
      - "fix/*"
      - "refactor/*"
      - "spike/*"
      - "test/*"
      - "experiment/*"
      - "wip/*"
      - "tmp/*"
      - "draft/*"
      - "renovate/*"
      - "dependabot/*"
      - "support/*"
      - "develop"
      - "main"
